
{% extends "base.html" %}

{% block title %}회원가입 | ORBIT AI{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-icon">◉</div>
        <p class="eyebrow">JOIN ORBIT</p>
        <h1>새로운 시작을 함께해요.</h1>
        <p class="auth-description">
            계정을 만들고 나만의 AI 공간을 준비하세요.
        </p>

        <form method="POST" class="auth-form">
            <label for="username">이름</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="사용할 이름을 입력하세요"
                autocomplete="username"
                required
            >

            <label for="email">이메일</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="이메일을 입력하세요"
                autocomplete="email"
                required
            >

            <label for="password">비밀번호</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="8자 이상 입력하세요"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">비밀번호 확인</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="비밀번호를 한 번 더 입력하세요"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="primary-button">
                계정 만들기 <span>→</span>
            </button>
        </form>

        <p class="auth-switch">
            이미 계정이 있나요?
            <a href="{{ url_for('main.login') }}">로그인</a>
        </p>
    </div>
</section>
{% endblock %}
